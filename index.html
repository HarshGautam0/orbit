<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Orbit</title>
    <meta name="application-name" content="Orbit" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f1115" id="tc" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #0f1115;
        --fg: #e8eaed;
        --card: rgba(255, 255, 255, 0.08);
        --muted: #98a1b3;
        --accent: #6ea8fe;
        --on: #0b0f1a;
        --line: rgba(255, 255, 255, 0.14);
        --tile: 60px;
        --r: 18px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg) center/cover fixed no-repeat;
        color: var(--fg);
        font:
          16px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        overflow: hidden;
        transition:
          background 0.4s,
          color 0.3s;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      .glass {
        background: var(--card);
        border: 1px solid var(--line);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
      }
      #stage {
        position: fixed;
        top: calc(7vh + var(--tb, 0px) + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(660px, 92vw);
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: clamp(18px, 4vh, 36px);
      }
      #hero {
        text-align: center;
        pointer-events: none;
      }
      #analog {
        display: block;
        margin: 0 auto 12px;
        width: clamp(110px, min(30vw, 26vh), 240px);
        height: clamp(110px, min(30vw, 26vh), 240px);
        filter: drop-shadow(0 10px 24px #0005);
        overflow: visible;
      }
      #hero.both #time {
        font-size: clamp(28px, 6vw, 46px);
      }
      #hero.analog #hello,
      #hero.both #hello {
        margin-top: 2px;
      }
      @media (max-height: 520px) {
        #stage {
          top: calc(3vh + var(--tb, 0px) + env(safe-area-inset-top));
          gap: 10px;
        }
        #hello {
          font-size: 13px;
          margin-top: 0;
        }
        #analog {
          width: min(30vh, 150px);
          height: min(30vh, 150px);
          margin-bottom: 0;
        }
        #time {
          font-size: 36px;
        }
        #engines {
          margin-bottom: 8px;
        }
        #q {
          padding: 12px 22px;
        }
      }
      @media (max-width: 380px) {
        .chip {
          padding: 6px 12px;
          font-size: 13px;
        }
      }
      #search {
        width: 100%;
      }
      #time {
        font-size: clamp(44px, 9vw, 84px);
        font-weight: 200;
        letter-spacing: -2px;
        line-height: 1;
      }
      #hello {
        margin-top: 6px;
        color: var(--fg);
        opacity: 0.85;
        font-size: clamp(14px, 2.4vw, 18px);
        text-shadow: 0 1px 8px #0006;
      }
      #engines {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .chip {
        padding: 7px 16px;
        border-radius: 99px;
        cursor: pointer;
        font-size: 14px;
        color: var(--muted);
        transition: 0.2s;
      }
      .chip:hover {
        color: var(--fg);
        transform: translateY(-1px);
      }
      .chip.on {
        background: var(--accent);
        color: var(--on);
        border-color: transparent;
        font-weight: 600;
        box-shadow: 0 6px 20px -6px var(--accent);
      }
      #q {
        width: 100%;
        padding: 17px 26px;
        border-radius: 99px;
        font-size: 17px;
        outline: none;
        color: var(--fg);
        transition: 0.25s;
      }
      #q::placeholder {
        color: var(--muted);
      }
      #q:focus {
        border-color: var(--accent);
        box-shadow:
          0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent),
          0 12px 40px -12px #0008;
      }
      .tile {
        position: absolute;
        width: calc(var(--tile) + 28px);
        text-align: center;
        user-select: none;
        -webkit-user-select: none;
      }
      .tile a {
        display: block;
        color: var(--fg);
        text-decoration: none;
      }
      .ico {
        width: var(--tile);
        height: var(--tile);
        margin: 0 auto 7px;
        border-radius: var(--r);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        font-weight: 600;
        font-size: calc(var(--tile) * 0.38);
        color: var(--accent);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 6px 18px -8px #0007;
      }
      .tile:hover .ico {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 14px 26px -10px #000a;
      }
      .ico img {
        position: absolute;
        width: 55%;
        height: 55%;
      }
      .lbl {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 4px #0006;
      }
      .nolbl .lbl {
        display: none;
      }
      body.flow {
        overflow-y: auto;
        overflow-x: hidden;
      }
      body.flow #stage {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        margin: calc(5vh + var(--tb, 0px) + env(safe-area-inset-top)) auto 0;
      }
      body.flow #canvas {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: flex-start;
        gap: 10px 4px;
        padding: 26px 14px calc(110px + env(safe-area-inset-bottom));
        max-width: 760px;
        margin: 0 auto;
      }
      body.flow .tile {
        position: relative;
      }
      .flow.editing .tile {
        cursor: default;
        touch-action: auto;
      }
      .flow.editing .tile .ico {
        outline: none;
        animation: none;
      }
      #nav {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
        z-index: 8;
        display: flex;
        gap: 2px;
        padding: 4px;
        border-radius: 99px;
      }
      #nav button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: none;
        cursor: pointer;
        color: var(--fg);
        display: grid;
        place-items: center;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
      }
      #nav button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #nav button:hover:not(:disabled) {
        background: var(--accent);
        color: var(--on);
      }
      #nav button:active:not(:disabled) {
        transform: scale(0.9);
      }
      #nav button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #nav[hidden] {
        display: none;
      }
      #titlebar {
        display: none;
        position: fixed;
        top: 0;
        left: var(--tbx, 0px);
        width: var(--tbw, 100%);
        height: var(--tb, 0px);
        z-index: 7;
        align-items: center;
        gap: 8px;
        padding: 0 12px 0 calc(8px + 3 * 30px + 18px);
        -webkit-app-region: drag;
        app-region: drag;
        background: color-mix(in srgb, var(--solid) 62%, transparent);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--muted);
        user-select: none;
        -webkit-user-select: none;
      }
      #titlebar img {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      html.wco #titlebar {
        display: flex;
      }
      html.wco #nav {
        top: 0;
        left: calc(var(--tbx, 0px) + 8px);
        height: var(--tb);
        padding: 0;
        border: 0;
        background: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        border-radius: 0;
        align-items: center;
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
      html.wco #nav button {
        width: 30px;
        height: 28px;
        border-radius: 8px;
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
      html.wco #nav button svg {
        width: 16px;
        height: 16px;
      }
      .editing .tile {
        cursor: grab;
        touch-action: none;
      }
      .editing .tile .ico {
        outline: 2px dashed var(--accent);
        outline-offset: 3px;
        animation: wob 0.5s infinite alternate;
      }
      @keyframes wob {
        from {
          transform: rotate(-1.5deg);
        }
        to {
          transform: rotate(1.5deg);
        }
      }
      .tile .x,
      .tile .e {
        display: none;
        position: absolute;
        top: -6px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 0;
        background: var(--accent);
        color: var(--on);
        font-size: 11px;
        cursor: pointer;
        z-index: 2;
      }
      .tile .x {
        right: 6px;
      }
      .tile .e {
        left: 6px;
      }
      .editing .tile .x,
      .editing .tile .e {
        display: block;
      }
      #bar {
        position: fixed;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        z-index: 6;
      }
      #bar button {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        transition: 0.2s;
      }
      #bar button:hover {
        transform: translateY(-2px);
      }
      #bar button.on {
        background: var(--accent);
        color: var(--on);
      }
      #add {
        display: none;
      }
      .editing #add {
        display: block;
      }
      /* modal + drawer */
      #shade {
        position: fixed;
        inset: var(--tb, 0px) 0 0 0;
        background: #0007;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 20;
      }
      #shade.open {
        opacity: 1;
        pointer-events: auto;
      }
      #drawer {
        position: fixed;
        top: var(--tb, 0px);
        right: 0;
        height: calc(100dvh - var(--tb, 0px));
        width: min(380px, 100vw);
        z-index: 21;
        transform: translateX(105%);
        transition: transform 0.3s;
        overflow-y: auto;
        padding: 20px 20px calc(30px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--bg) 82%, #000 0%);
        border-left: 1px solid var(--line);
      }
      #drawer.open {
        transform: none;
      }
      #drawer h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      #drawer h4 {
        margin: 22px 0 10px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        cursor: pointer;
      }
      #themes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .sw {
        aspect-ratio: 1;
        border-radius: 14px;
        border: 2px solid transparent;
        cursor: pointer;
        position: relative;
        padding: 0;
      }
      .sw.on {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .sw i {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .sw b {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -18px;
        font-size: 10px;
        font-weight: 400;
        text-align: center;
        color: var(--muted);
      }
      #themes {
        margin-bottom: 26px;
        row-gap: 28px;
      }
      #bgs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .bt {
        aspect-ratio: 16/10;
        border-radius: 10px;
        border: 2px solid transparent;
        background: var(--card) center/cover;
        cursor: pointer;
        padding: 0;
        font-size: 11px;
        color: var(--muted);
      }
      .bt.on {
        border-color: var(--accent);
      }
      .fld {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0;
        font-size: 14px;
      }
      .fld input[type="range"] {
        width: 55%;
        accent-color: var(--accent);
      }
      .fld input[type="color"] {
        width: 44px;
        height: 30px;
        border: 0;
        background: none;
        padding: 0;
      }
      .seg {
        display: flex;
        gap: 6px;
      }
      .seg button {
        padding: 5px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: none;
        cursor: pointer;
        font-size: 13px;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--on);
        border-color: transparent;
      }
      .txt {
        width: 100%;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        outline: none;
        font-size: 14px;
      }
      .txt:focus {
        border-color: var(--accent);
      }
      .eng {
        display: grid;
        grid-template-columns: 1fr 1.6fr auto auto;
        gap: 6px;
        margin-bottom: 8px;
        align-items: center;
      }
      .eng label {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .btn {
        padding: 9px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        cursor: pointer;
        font-size: 14px;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.pri {
        background: var(--accent);
        color: var(--on);
        border-color: transparent;
      }
      .btn.dan {
        color: #ff7b7b;
      }
      .btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      #modal {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -46%) scale(0.96);
        width: min(400px, 92vw);
        padding: 22px;
        border-radius: 22px;
        z-index: 22;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        background: color-mix(in srgb, var(--bg) 85%, #000 0%);
      }
      #modal.open {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      #modal {
        max-height: 90dvh;
        overflow-y: auto;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(80px + env(safe-area-inset-bottom));
        transform: translate(-50%, 20px);
        max-width: 90vw;
        padding: 10px 18px;
        border-radius: 99px;
        background: var(--accent);
        color: var(--on);
        font-size: 14px;
        font-weight: 600;
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        text-align: center;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .flash .ico {
        animation: pulse 0.5s 3;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.18);
          box-shadow: 0 0 0 6px
            color-mix(in srgb, var(--accent) 40%, transparent);
        }
      }
      #modal details {
        margin-top: 12px;
      }
      #modal summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      #modal .btns {
        position: sticky;
        bottom: -22px;
        padding: 12px 0 0;
        margin-bottom: -6px;
        background: inherit;
      }
      #modal select,
      #modal select option {
        background: var(--solid);
        color: var(--fg);
      }
      #modal h3 {
        margin: 0 0 12px;
      }
      #modal label {
        display: block;
        margin: 12px 0 5px;
        font-size: 13px;
        color: var(--muted);
      }
      #modal .btns {
        justify-content: flex-end;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="hero">
        <svg id="analog" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
        <div id="time"></div>
        <div id="hello"></div>
      </div>
      <div id="search">
        <div id="engines"></div>
        <form id="f">
          <input
            id="q"
            class="glass"
            type="search"
            placeholder="Search…"
            autocomplete="off"
            autofocus
          />
        </form>
      </div>
    </div>
    <div id="nav" class="glass">
      <button id="nb" type="button" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button
      ><button id="nf" type="button" title="Forward" aria-label="Forward">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></button
      ><button id="nr" type="button" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24">
          <path d="M20 12a8 8 0 1 1-2.6-5.9" />
          <path d="M20 4v5h-5" />
        </svg>
      </button>
    </div>
    <div id="titlebar">
      <img src="icons/favicon-32.png" alt="" /><span>Orbit</span>
    </div>
    <div id="canvas"></div>
    <div id="bar">
      <button id="add" class="glass" title="Add shortcut">＋</button>
      <button id="edit" class="glass" title="Arrange tiles">✎</button>
      <button id="cfg" class="glass" title="Settings">⚙</button>
    </div>

    <div id="toast"></div>
    <div id="shade"></div>
    <form id="modal" class="glass" autocomplete="off" novalidate>
      <h3 id="mt">Shortcut</h3>
      <label>Name</label><input id="tn" class="txt" />
      <label>URL or app link</label
      ><input
        id="tu"
        class="txt"
        placeholder="example.com  or  spotify:"
        autocapitalize="off"
        spellcheck="false"
      />
      <label>Icon (optional emoji)</label
      ><input id="ti" class="txt" placeholder="🎵" /> <label>Open in</label
      ><select id="tm" class="txt">
        <option value="">Default (see Settings)</option>
        <option value="app">Installed app (same window)</option>
        <option value="tab">New browser tab</option>
      </select>
      <div class="btns">
        <button type="button" class="btn" id="mc">Cancel</button
        ><button type="submit" class="btn pri" id="msave">Save</button>
      </div>
    </form>
    <aside id="drawer"></aside>

    <script>
      const THEMES = {
        midnight: {
          n: "Midnight",
          bg: "linear-gradient(135deg,#0c0e14,#1a2033)",
          fg: "#e8eaed",
          card: "rgba(255,255,255,.08)",
          muted: "#98a1b3",
          accent: "#6ea8fe",
          on: "#0b0f1a",
          line: "rgba(255,255,255,.14)",
          tc: "#0c0e14",
        },
        light: {
          n: "Light",
          bg: "linear-gradient(135deg,#f6f8fc,#dfe7f4)",
          fg: "#1c1e22",
          card: "rgba(255,255,255,.7)",
          muted: "#667085",
          accent: "#3b6ef6",
          on: "#fff",
          line: "rgba(0,0,0,.1)",
          tc: "#f6f8fc",
        },
        aurora: {
          n: "Aurora",
          bg: "linear-gradient(135deg,#0b1026,#1b2a5c 50%,#0f5e64)",
          fg: "#eaf6ff",
          card: "rgba(255,255,255,.09)",
          muted: "#9fb8d0",
          accent: "#5eead4",
          on: "#06201f",
          line: "rgba(255,255,255,.16)",
          tc: "#0b1026",
        },
        sunset: {
          n: "Sunset",
          bg: "linear-gradient(135deg,#2b1055,#7b2d6e 55%,#f2784b)",
          fg: "#fff4ec",
          card: "rgba(255,255,255,.12)",
          muted: "#f0c6c0",
          accent: "#ffc46b",
          on: "#3a1500",
          line: "rgba(255,255,255,.2)",
          tc: "#2b1055",
        },
        forest: {
          n: "Forest",
          bg: "linear-gradient(135deg,#0d1f17,#1b4332 60%,#2d6a4f)",
          fg: "#e9f7ef",
          card: "rgba(255,255,255,.09)",
          muted: "#a5c9b4",
          accent: "#95d5b2",
          on: "#0a1f14",
          line: "rgba(255,255,255,.15)",
          tc: "#0d1f17",

          if (x < m || y < m || x + tw > W - m || y + th > H - m) return true;
          const a = { l: x, t: y, r: x + tw, b: y + th };

            forb.some(

  <p style="font-size:12px;color:var(--muted)">Use <b>%s</b> where the query goes. “Copy” copies your text to the clipboard (for sites like Gemini that can't take a query in the URL).</p>
  <h4>Privacy</h4>
  <p style="font-size:12px;color:var(--muted);margin:0">No analytics, cookies, accounts or tracking. Everything is stored only in this browser. The app makes no network requests of its own; the only traffic is when you search (to the engine you chose) or open a link. Site icons are off by default for this reason.</p>

  <p style="font-size:11px;color:var(--muted);margin-top:18px">Version 19</p>`;

          i.accept = ".json";
          i.onchange = async () => {
            try {
              const o = JSON.parse(await i.files[0].text());
              localStorage.setItem(KEY, JSON.stringify(o));
              location.reload();
            } catch {
              alert("Invalid file");

          };

      function engineRows() {
        const el = $("elist");
        el.innerHTML = "";
        S.engines.forEach((e, i) => {
          const r = document.createElement("div");
          r.className = "eng";
          r.innerHTML = `<input class="txt" placeholder="Name"><input class="txt" placeholder="URL with %s"><label><input type="checkbox">copy</label><button type="button" class="btn dan" style="padding:6px 10px">✕</button>`;
          const [n, u, cp, del] = [
            r.children[0],
            r.children[1],
            r.children[2].firstChild,
            r.children[3],
          ];
          n.value = e.n;
          u.value = e.u;
          cp.checked = !!e.copy;
          n.oninput = () => {
            e.n = n.value;
            save();
            renderEngines();
          };
          u.oninput = () => {
            e.u = u.value;
            save();
          };
          cp.onchange = () => {
            e.copy = cp.checked ? 1 : 0;
            save();
          };
          del.onclick = () => {
            if (S.engines.length < 2) return;
            S.engines.splice(i, 1);
            S.engine = Math.min(S.engine, S.engines.length - 1);
            save();
            renderEngines();
            engineRows();
          };
          el.appendChild(r);
        });
      }
      $("cfg").onclick = openSettings;

      applyStyle();
      renderEngines();
      renderTiles();
      wco();
      syncNav();
      if ("serviceWorker" in navigator) {
        const had = !!navigator.serviceWorker.controller;
        let rl = false;
        navigator.serviceWorker.register("sw.js").catch(() => {});
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!had || rl || $("modal").classList.contains("open")) return;
          rl = true;
          location.reload();
        });
      }
    </script>
